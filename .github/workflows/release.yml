name: Release

on:
  push:
    branches: [main]

# Least privilege: contents + pull-requests for the "Version Packages" PR,
# id-token for npm provenance (OIDC).
permissions:
  contents: write
  pull-requests: write
  id-token: write

# Never run two releases at once, and never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: version PR / publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm 11.25.0 via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + lint + test)
        run: pnpm check

      - name: Build
        run: pnpm build

      # No unreleased changesets: opens/updates the "Version Packages" PR.
      # Version PR merged (changesets consumed): publishes unpublished versions.
      # The publish script fails loudly if NPM_TOKEN is missing; the version PR
      # path does not need the token. `changeset publish` skips private packages.
      - name: Version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          publish: sh .github/scripts/publish.sh
          title: Version Packages
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
